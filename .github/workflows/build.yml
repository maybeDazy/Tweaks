name: Build Theos Deb

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            git \
            perl \
            python3 \
            fakeroot \
            dpkg-dev \
            xz-utils \
            libplist-utils \
            curl \
            ca-certificates

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iPhoneOS SDK
        run: |
          "$THEOS/bin/install-sdk" latest

      - name: Build roothide package
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeChordRecorder-roothide-deb
          path: packages/*.deb
