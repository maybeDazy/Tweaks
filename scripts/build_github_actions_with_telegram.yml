name: Build VolumeChordRecorder debs (roothide + rootless)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [ roothide, rootless ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static gate (vcr_check)
        run: python3 scripts/vcr_check.py

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            git \
            perl \
            python3 \
            fakeroot \
            dpkg-dev \
            xz-utils \
            libplist-utils \
            curl \
            ca-certificates \
            make

      - name: Install RootHide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify RootHide Theos
        run: |
          echo "THEOS=$THEOS"
          test -e "$THEOS/vendor/mod/roothide"

      - name: Ensure iPhoneOS SDK
        run: |
          if ls "$THEOS/sdks"/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "SDK already exists, skipping install-sdk"
            ls -la "$THEOS/sdks"
          else
            "$THEOS/bin/install-sdk" latest || true
            ls -la "$THEOS/sdks"
          fi

      - name: Build ${{ matrix.scheme }} package
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} FINALPACKAGE=1
          ls -la packages

      - name: Report control + postinst (evidence for docs/COMPAT.md)
        run: |
          DEB="$(ls -1 packages/*.deb | head -n 1)"
          echo "--- dpkg-deb -f ---"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          echo "--- control archive ---"
          rm -rf /tmp/ctl
          dpkg-deb -e "$DEB" /tmp/ctl
          ls -la /tmp/ctl
          cat /tmp/ctl/postinst 2>/dev/null || true
          echo "--- SDKs present in the toolchain ---"
          ls -la "$THEOS/sdks" || true
          echo "--- dylib platform info (best effort) ---"
          rm -rf /tmp/payload
          dpkg-deb -x "$DEB" /tmp/payload
          (otool -l /tmp/payload/usr/lib/TweakInject/VolumeChordRecorder.dylib 2>/dev/null || llvm-otool -l /tmp/payload/usr/lib/TweakInject/VolumeChordRecorder.dylib 2>/dev/null) | grep -A4 LC_BUILD_VERSION || echo "(no otool on this runner; minos is verified on the device instead)"

      - name: Upload ${{ matrix.scheme }} deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeChordRecorder-${{ matrix.scheme }}-deb
          path: packages/*.deb

  telegram:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs

      - name: Send debs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not set. Skipping Telegram upload."
            exit 0
          fi
          for f in $(find debs -name '*.deb' | sort); do
            echo "sending $f"
            CAPTION="VolumeChordRecorder $(basename "$f") - ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            curl -fS \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "caption=${CAPTION}" \
              -F "document=@${f}"
          done
